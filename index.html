<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cuestionario — Nuevo sitio Ranger's F.C.</title>
<meta http-equiv="refresh" content="4; url=https://airtable.com/appDFPEDITr8GwZT3/pagebiEv45DvD4bPn/form">
<style>
  :root{
    --navy:#0e1633; --blue:#233e94; --gold:#ffcb05; --chalk:#f2f4fb; --mist:#98a5ce;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:radial-gradient(700px 420px at 80% -10%, rgba(62,92,196,.28), transparent 60%), var(--navy);
    color:var(--chalk);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    text-align:center;padding:24px;
  }
  .card{max-width:520px}
  .crest{
    width:56px;height:62px;margin:0 auto 22px;
    background:var(--blue);
    clip-path:polygon(0 0,100% 0,100% 68%,50% 100%,0 68%);
    display:grid;place-items:center;
    font-family:"Archivo",sans-serif;font-weight:900;font-size:24px;color:var(--gold);
  }
  .kicker{
    font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--gold);margin:0 0 12px;
  }
  h1{
    font-family:"Archivo",system-ui,sans-serif;font-weight:800;
    font-size:clamp(24px,5vw,34px);line-height:1.1;margin:0 0 14px;
  }
  p{color:var(--mist);font-size:15.5px;line-height:1.6;margin:0 0 28px}
  .btn{
    display:inline-block;background:var(--gold);color:#131313;
    font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:15px;
    text-transform:uppercase;letter-spacing:.03em;text-decoration:none;
    padding:15px 30px;border-radius:5px;
    transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 160ms ease;
  }
  .btn:active{transform:scale(0.97)}
  @media (hover:hover) and (pointer:fine){.btn:hover{background:#ffd83f}}
  .tip{font-size:12.5px;color:var(--mist);margin-top:26px;font-family:ui-monospace,monospace}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=IBM+Plex+Sans:wght@400;600&display=swap">
</head>
<body>
  <main class="card">
    <div class="crest" aria-hidden="true">R</div>
    <p class="kicker">Syntra Talent · Levantamiento de proyecto</p>
    <h1>Cuestionario — Nuevo sitio Ranger's F.C.</h1>
    <p>Te estamos llevando al cuestionario. Pueden <strong style="color:var(--chalk)">enviar varias veces</strong>: si no terminan hoy, envíen lo que llevan y completen el resto en otro envío.</p>
    <a class="btn" href="https://airtable.com/appDFPEDITr8GwZT3/pagebiEv45DvD4bPn/form">Abrir el cuestionario</a>
    <p class="tip">Si no avanza automáticamente, usa el botón.</p>
  </main>
  <script>
    setTimeout(function(){
      window.location.href = "https://airtable.com/appDFPEDITr8GwZT3/pagebiEv45DvD4bPn/form";
    }, 2500);
  </script>
</body>
</html>
